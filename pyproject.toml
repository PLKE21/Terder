[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matamaple-trader"
version = "0.1.0"
description = "Local-first Quant/ML trading signal platform for XM / MetaTrader 5"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
]

[project.scripts]
matamaple-xm-readiness = "matamaple_trader.readiness.cli:main"
matamaple-xm-collect = "matamaple_trader.data.collection_cli:main"

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
data = ["pyarrow>=16,<20"]
ml = [
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<4",
  "lightgbm>=4.3,<5",
]
ui = ["streamlit>=1.39,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
