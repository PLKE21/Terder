[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "matamaple-trader"
version = "0.4.0"
description = "Local-first FBS MetaTrader 5 Quant/ML trading platform with fail-closed demo execution"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.2,<3",
]

[project.scripts]
matamaple-fbs-readiness = "matamaple_trader.readiness.cli:main"
matamaple-fbs-collect = "matamaple_trader.data.collection_cli:main"
matamaple-dataset-review = "matamaple_trader.validation.dataset_review_cli:main"
matamaple-holdout-proposal = "matamaple_trader.validation.holdout_cli:main"
matamaple-freeze-holdout = "matamaple_trader.validation.freeze_holdout_cli:main"
matamaple-development-experiment = "matamaple_trader.experiments.cli:main"
matamaple-lock-candidate = "matamaple_trader.validation.candidate_lock_cli:main"
matamaple-evaluate-holdout = "matamaple_trader.validation.holdout_eval_cli:main"
matamaple-release-readiness = "matamaple_trader.validation.release_readiness_cli:main"
matamaple-demo-readiness = "matamaple_trader.demo.readiness_cli:main"
matamaple-dashboard = "matamaple_trader.dashboard.cli:main"

[project.optional-dependencies]
mt5 = ["MetaTrader5>=5.0.45"]
data = ["pyarrow>=16,<20"]
ml = [
  "scikit-learn>=1.4,<2",
  "xgboost>=2.0,<4",
  "lightgbm>=4.3,<5",
]
ui = ["streamlit>=1.39,<2"]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
